<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070B" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>كمين — KAMEEN</title>
  <link rel="icon" type="image/jpeg" href="./logo.jpg" />
  <link rel="apple-touch-icon" href="./logo.jpg" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-role="neutral">
  <div id="danger-vignette" class="hidden"></div>
  <div id="toast-root"></div>

  <!-- Native App Shell (Non-Map Screens with Fixed Header + Scroll Area + Native Bottom Tab Bar) -->
  <div id="app-shell" class="app-shell">
    <header id="app-header" class="app-topbar"></header>
    <main id="page-root" class="app-scroll"></main>
    <nav id="app-tabbar" class="app-tabbar"></nav>
  </div>

  <!-- Full-Bleed Native Map Screen (Create Zone / Imposter HUD / Investigator HUD / Ghost HUD) -->
  <div id="map-screen" class="hidden">
    <div id="persistent-leaflet-map"></div>
    <svg id="fallback-radar" class="hidden" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="map-grid-fx"></div>
    <div id="map-hud-top"></div>
    <div id="map-side-fabs"></div>
    <div id="sim-dpad-root" class="hidden"></div>
    <div id="map-hud-bottom"></div>
  </div>

  <!-- Native Bottom Sheets & Full-Screen Role Modals -->
  <div id="modal-root"></div>

  <script src="./config.js"></script>
  <script src="./engine.js"></script>
  <script src="./ai.js"></script>
  <script src="./network.js"></script>
  <script src="./map.js"></script>
  <script src="./ui.js"></script>
  <script src="./app.js"></script>
</body>
</html>
