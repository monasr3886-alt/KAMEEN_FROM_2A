<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>كمين — KAMEEN</title>
  <link rel="icon" type="image/jpeg" href="./logo.jpg" />
  <link rel="apple-touch-icon" href="./logo.jpg" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="" />
  <link rel="stylesheet" href="./styles.css?v=20" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-role="neutral">
  <div id="danger-vignette" class="hidden"></div>
  <div id="heartbeat-vignette" class="hidden"></div>
  <div id="toast-root"></div>

  <!-- Pure #000000 AMOLED Pocket Lock Overlay (Saves battery + blocks accidental pocket taps while keeping GPS alive) -->
  <div id="pocket-overlay" class="pocket-overlay hidden" onclick="onPocketOverlayTap()">
    <div class="pocket-inner">
      <div class="pocket-badge">POCKET SHIELD • GPS ACTIVE</div>
      <div id="pocket-clock" class="pocket-clock mono">00:00</div>
      <div id="pocket-status" class="pocket-status">داخل الزون • الـ GPS شغال في الخلفية</div>
      <div id="pocket-unlock-hint" class="pocket-hint">اضغط مرتين سريعاً لفتح الشاشة</div>
    </div>
  </div>

  <!-- Non-Map Tactical App Shell -->
  <div id="app-shell" class="app-shell">
    <header id="app-header" class="app-topbar"></header>
    <main id="page-root" class="app-scroll"></main>
    <nav id="app-tabbar" class="app-tabbar"></nav>
  </div>

  <!-- Full-Bleed Zero-Overlap Tactical Radar Screen -->
  <div id="map-screen" class="hidden">
    <div id="persistent-gl-map"></div>
    <svg id="fallback-radar" class="hidden" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice"></svg>

    <div class="map-hud-shell">
      <div id="map-hud-top" class="hud-zone-top"></div>
      <div class="hud-zone-mid">
        <div id="map-side-fabs" class="hud-side-rail"></div>
        <div id="sim-dpad-root" class="sim-dpad hidden"></div>
      </div>
      <div id="map-hud-bottom" class="hud-zone-bottom"></div>
    </div>
  </div>

  <!-- Tactical Slide-Up Drawers & Focus Modals -->
  <div id="modal-root"></div>

  <script src="./config.js?v=20"></script>
  <script src="./engine.js?v=20"></script>
  <script src="./location.js?v=20"></script>
  <script src="./ai.js?v=20"></script>
  <script src="./network.js?v=20"></script>
  <script src="./map.js?v=20"></script>
  <script src="./ui.js?v=20"></script>
  <script src="./app.js?v=20"></script>
</body>
</html>
